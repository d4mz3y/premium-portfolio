<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Innovated Funded Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .gradient-bg {
            background: radial-gradient(circle at top right, #3b82f6, transparent), radial-gradient(circle at bottom left, #8b5cf6, transparent);
        }
    </style>
</head>

<body class="bg-[#0f172a] text-white">
    <nav class="p-6 flex justify-between items-center max-w-7xl mx-auto">
        <div class="font-black text-2xl tracking-tighter">INNOVATED<span class="text-blue-500">FUNDED</span></div>
        <div class="hidden md:flex gap-8 text-sm font-medium text-white/60">
            <span class="hover:text-white cursor-pointer transition-colors">Solutions</span>
            <span class="hover:text-white cursor-pointer transition-colors">Pricing</span>
            <span class="hover:text-white cursor-pointer transition-colors">About</span>
        </div>
        <button
            class="bg-blue-600 hover:bg-blue-700 px-6 py-2.5 rounded-full font-bold transition-all shadow-lg shadow-blue-500/20">Get
            Started</button>
    </nav>

    <header class="py-24 px-6 text-center max-w-4xl mx-auto relative overflow-hidden">
        <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-blue-500/10 blur-[120px] rounded-full">
        </div>
        <h1 class="text-5xl md:text-7xl font-black mb-8 leading-[1.1] tracking-tight relative z-10">Empowering Your
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400">Fintech
                Vision</span></h1>
        <p class="text-xl text-white/50 mb-10 max-w-2xl mx-auto tracking-wide relative z-10">Secure, Scalable, and
            Future-Focused funding infrastructure for modern startups.</p>
        <div class="flex flex-wrap justify-center gap-4 relative z-10">
            <button class="bg-white text-black px-8 py-4 rounded-full font-bold hover:bg-blue-50 transition-all">Launch
                Dashboard</button>
            <button
                class="bg-white/5 border border-white/10 px-8 py-4 rounded-full font-bold hover:bg-white/10 transition-all">Watch
                Demo</button>
        </div>
    </header>

    <section class="max-w-7xl mx-auto px-6 py-20 border-t border-white/5 grid md:grid-cols-4 gap-8 text-center">
        <div class="p-8 bg-white/5 rounded-3xl border border-white/10 hover:border-blue-500/30 transition-all">
            <div class="text-3xl font-black mb-2">$500M+</div>
            <div class="text-white/40 text-xs uppercase font-bold tracking-widest">Funded</div>
        </div>
        <div class="p-8 bg-white/5 rounded-3xl border border-white/10 hover:border-blue-500/30 transition-all">
            <div class="text-3xl font-black mb-2">1,200+</div>
            <div class="text-white/40 text-xs uppercase font-bold tracking-widest">Startups</div>
        </div>
        <div class="p-8 bg-white/5 rounded-3xl border border-white/10 hover:border-blue-500/30 transition-all">
            <div class="text-3xl font-black mb-2">99.9%</div>
            <div class="text-white/40 text-xs uppercase font-bold tracking-widest">Uptime</div>
        </div>
        <div class="p-8 bg-white/5 rounded-3xl border border-white/10 hover:border-blue-500/30 transition-all">
            <div class="text-3xl font-black mb-2">24/7</div>
            <div class="text-white/40 text-xs uppercase font-bold tracking-widest">Support</div>
        </div>
    </section>

    <div class="fixed bottom-8 right-8 flex gap-4">
        <button onclick="window.history.back()"
            class="bg-white/10 hover:bg-white/20 px-6 py-3 rounded-full font-bold transition-all border border-white/10 backdrop-blur-md">Back
            to Portfolio</button>
    </div>
</body>

</html>
